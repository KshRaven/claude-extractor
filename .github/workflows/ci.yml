name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        if: matrix.node == 22
        with:
          name: extension-builds
          path: dist/*.zip

  lint-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Mozilla's linter; advisory so a new rule never blocks a merge.
      - run: npm run lint:ext
        continue-on-error: true
