name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag must match manifest version
        run: |
          v=$(node -p "require('./extension/manifest.json').version")
          if [ "refs/tags/v$v" != "$GITHUB_REF" ]; then
            echo "Tag $GITHUB_REF does not match manifest version v$v" >&2
            exit 1
          fi
      - run: npm run ci
      - run: npm run build
      - name: Release notes from CHANGELOG.md
        run: node scripts/release.js --notes "${GITHUB_REF_NAME}" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: notes.md
